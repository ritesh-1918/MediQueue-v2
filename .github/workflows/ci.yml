name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mediqueue-v2/package-lock.json

      - name: Install dependencies
        working-directory: mediqueue-v2
        run: npm ci

      - name: TypeScript — no errors
        working-directory: mediqueue-v2
        run: npx tsc --noEmit

      - name: ESLint — no errors
        working-directory: mediqueue-v2
        run: npx next lint

      - name: Production build
        working-directory: mediqueue-v2
        env:
          # Stub values let Next.js resolve env var references at build time
          # without connecting to real services. All are replaced by real secrets
          # in the Vercel dashboard before production deploy.
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          STRIPE_SECRET_KEY: sk_test_stub
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_stub
          STRIPE_WEBHOOK_SECRET: whsec_stub
          NEXT_PUBLIC_POSTHOG_KEY: phc_stub
          NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
          SENTRY_DSN: https://stub@stub.ingest.sentry.io/0
          OPENAI_API_KEY: sk-stub
        run: npm run build
