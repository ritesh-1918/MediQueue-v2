name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — no errors
        run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kgvcmphpfhbxqouuctet.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_for_ci
          SUPABASE_SERVICE_ROLE_KEY: placeholder_for_ci
          GEMINI_API_KEY_1: placeholder
          GEMINI_API_KEY_2: placeholder
          GEMINI_API_KEY_3: placeholder
          OPENROUTER_API_KEY_1: placeholder
          OPENROUTER_API_KEY_2: placeholder
          OPENROUTER_API_KEY_3: placeholder
          GROQ_API_KEY_1: placeholder
          GROQ_API_KEY_2: placeholder
          HUGGINGFACE_API_KEY: placeholder

      - name: ESLint — no errors
        run: npm run lint
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kgvcmphpfhbxqouuctet.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_for_ci

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kgvcmphpfhbxqouuctet.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_for_ci
          SUPABASE_SERVICE_ROLE_KEY: placeholder_for_ci
          GEMINI_API_KEY_1: placeholder
          GEMINI_API_KEY_2: placeholder
          GEMINI_API_KEY_3: placeholder
          OPENROUTER_API_KEY_1: placeholder
          OPENROUTER_API_KEY_2: placeholder
          OPENROUTER_API_KEY_3: placeholder
          GROQ_API_KEY_1: placeholder
          GROQ_API_KEY_2: placeholder
          HUGGINGFACE_API_KEY: placeholder
